[project]
name = "dpr"
dynamic = ["version"]
description = "Deterministic data protection review for JS/TS and Python repositories"
readme = "README.md"
requires-python = ">=3.12"
license = "LicenseRef-Proprietary"
license-files = ["LICENSE"]
authors = [{ name = "Gawie van Blerk" }]
classifiers = [
    "Private :: Do Not Upload",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
    "Topic :: Security",
]
dependencies = [
    "tree-sitter>=0.25",
    "tree-sitter-javascript>=0.23",
    "tree-sitter-typescript>=0.23",
    "pyyaml>=6.0",
    "jinja2>=3.1",
]

[project.scripts]
dpr = "dpr.cli:main"

[dependency-groups]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/dpr/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/dpr"]

[tool.hatch.build.targets.sdist]
include = ["src/dpr", "tests", "README.md", "CHANGELOG.md", "LICENSE"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["tests/fixtures", "*.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["semgrep: needs the semgrep binary"]
addopts = "-ra"
