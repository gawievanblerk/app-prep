# End of security support for frameworks, runtimes and base images, bundled so a scan needs no
# network. Keys are release cycles; values are the last day of security fixes (YYYY-MM-DD).
# A version older than the oldest listed cycle is out of support too. Check and extend this
# table at each dpr release, and update `as_of`.
