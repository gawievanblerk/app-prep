# Rules that describe one underlying issue are grouped into one register entry.
# scope: app groups per app root; repo groups across the repository; linked groups the findings of
# the first rule by the file of their first site and attaches findings of the other rules that
# share a file with them; `joined` is added to the title when they do.
chains:
  - title: Accounts can be signed in to with passwords written in the repository
    scope: linked
    rules: [BASE-LITERAL-PASSWORD-HASH, BASE-SEED-ON-START]
    joined: ", and a start command runs it"
  - title: Secret settings fall back to committed values
    scope: linked
    rules: [LEAK-SECRET-ENV-DEFAULT, BASE-PICKLE-SESSIONS]
    joined: ", and sessions use Pickle, so a signed session can run code on the server"
  - title: Account responses reveal which accounts exist
    scope: app
    rules: [AUTH-ENUM-SIGNUP-MESSAGE, AUTH-ENUM-RESET-MESSAGE, AUTH-ENUM-LOCKOUT-STATUS, AUTH-ENUM-TIMING]
  - title: Sessions outlive logout or have no absolute limit
    scope: app
    rules: [AUTH-LOGOUT-NO-REVOKE, AUTH-REFRESH-NO-ABSOLUTE-CAP]
  - title: One-time tokens are stored in plain text, never expire or can be reused
    scope: app
    rules: [AUTH-TOKEN-PLAINTEXT, AUTH-VERIFY-NO-EXPIRY, AUTH-VERIFY-REUSABLE, AUTH-RESET-NO-EXPIRY]
  - title: Rate limits do not hold in production
    scope: app
    rules: [ABUSE-INMEMORY-LIMITER, ABUSE-LIMITER-NOT-APPLIED, ABUSE-LIMITER-PROXY-IP]
  - title: Paid endpoints can run up the bill
    scope: app
    rules: [ABUSE-PAID-UNAUTH, ABUSE-PAID-UNLIMITED, ABUSE-NO-KILL-SWITCH]
  - title: Security headers or HTTPS enforcement are missing or weak
    scope: repo
    rules: [BASE-HEADER-MISSING-HSTS, BASE-HEADER-MISSING-CSP, BASE-HEADER-MISSING-XCTO, BASE-HEADER-MISSING-FRAME, BASE-HEADER-MISSING-REFERRER, BASE-HEADER-MISSING-PERMISSIONS, BASE-CSP-WEAK, BASE-HTTPS-NOT-ENFORCED, BASE-NO-HTTPS-REDIRECT]
  - title: Database reachable too widely or used with administrator rights
    scope: repo
    rules: [BASE-DB-NETWORK-OPEN, BASE-DB-ADMIN-LOGIN]
  - title: Unpinned dependencies or installs
    scope: repo
    rules: [OWASP-A08-UNPINNED-DEPS, OWASP-A08-UNPINNED-INSTALL]
  - title: Cookie flags leave sessions exposed
    scope: app
    rules: [BASE-COOKIE-HTTPONLY, BASE-COOKIE-SECURE, BASE-COOKIE-SAMESITE, BASE-SAMESITE-NONE-NO-CSRF]
  - title: Third-party libraries are copied into the repository
    scope: app
    rules: [OWASP-A06-VENDORED-LIB]
  - title: Provider callbacks accept forged requests
    scope: app
    rules: [OWASP-A01-UNSIGNED-CALLBACK]
  - title: Signed-in actions can be started from other sites
    scope: app
    rules: [OWASP-A01-CSRF-EXEMPT, OWASP-A04-GET-SIDE-EFFECT]
  - title: Uploads are unbounded or unchecked
    scope: app
    rules: [OWASP-A04-UPLOAD-LIMIT, OWASP-A04-UNCHECKED-UPLOAD]
  - title: Credentials or personal data travel over plain HTTP or in URLs
    scope: app
    rules: [OWASP-A02-PLAIN-HTTP-CALL, OWASP-A02-SECRET-IN-URL]
  - title: Deploy files run as root, make files world-writable or ship the whole folder
    scope: repo
    rules: [BASE-DOCKERIGNORE-THIN, BASE-WORLD-WRITABLE, BASE-DOCKER-ROOT]
