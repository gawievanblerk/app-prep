# Published security advisories for packages whose versions dpr reads (exact pins in
# requirements files, pyproject.toml, Pipfile and package.json, and versions read from libraries
# copied into the repository), bundled so a scan needs no network. This is a small, hand-checked
# list, not an advisory database: a package or advisory missing here may still be vulnerable.
# Only entries whose id, affected range and fixed version are certain are listed. Check and
# extend this table at each dpr release, and update `as_of`.
#
# affected: [introduced, fixed] pairs; a version v is affected when introduced <= v < fixed.
#           "0" means every earlier version; a null fixed means no release fixes it.
# severity: dpr's rating of the flaw for a typical web application (critical, high, medium, low).
as_of: 2026-06-01
# Names of copied libraries (vendored_libs.yaml, lower case) and the package they are.
names:
  jquery: jquery
  jquery ui: jquery-ui
  bootstrap: bootstrap
  pdf.js: pdfjs-dist
  moment.js: moment
  lodash: lodash
