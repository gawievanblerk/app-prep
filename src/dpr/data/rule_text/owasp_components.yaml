OWASP-A06-VENDORED-LIB:
  title: Third-party library ${library} is copied into the repository
  effort_minutes: 30
  detail: ${count} file(s)${where} are a copy of ${library} (found by ${evidence}). A copied library gets no updates from a package manager and no dependency audit sees it, so a known flaw in this version stays until someone replaces the file by hand.${version_note} Code-pattern rules (XSS, eval, secrets in URLs, weak random, source maps) do not scan it; each copied library is listed once here instead.
  proof_needed: Open the files and confirm they are a third-party library rather than the app's own code, and check whether any page still loads them.
  attack: Look up published vulnerabilities for this library version and use one against the pages that load it.
  blast: Whatever the pages that load the library can read or do in a visitor's browser.
  fix: Manage it as a dependency and keep it updated. Install ${name} with the project's package manager (npm, pip) or load a pinned CDN build with an integrity hash, delete the copy, and remove it entirely if no page loads it.
  verify: Confirm the copied files are gone and the pages load the managed version.
OWASP-A05-DEBUG-ENDPOINT:
  title: Public ${method} ${path} returns internal detail
  effort_minutes: 15
  detail: ${method} ${path} is a health, test or debug route that anyone can call, and its response includes exception text, settings, versions or environment values.
  attack: Call ${method} ${path} (for example while a dependency is down) and read the error text, versions or settings it returns.
  blast: Internal host names, library versions and error detail that help plan other attacks.
  fix: Return only a status (ok or unavailable) from public health routes and log the detail on the server. Remove test and debug routes from production URLs or require staff sign-in.
  verify: Call ${method} ${path} with a failing dependency and confirm the body holds no exception text, versions or settings.
