BASE-PASSWORD-COMPOSITION:
  title: Passwords must contain set character types
  effort_minutes: 20
  detail: New passwords must include character types such as an upper case letter, a digit or a symbol. Rules like these push people to predictable patterns (Password1!) and do not stop guessing; NIST SP 800-63B asks verifiers not to impose them.
  proof_needed: Check that this code rejects passwords, rather than only scoring strength in a meter.
  attack: Guess passwords that follow the usual pattern the rule creates, such as a capitalised word, a year and an exclamation mark.
  blast: Accounts whose owners chose the predictable pattern the rule invites.
  fix: Drop the composition rules. Require a minimum length instead (15 characters when the password is the only factor, 8 with a second factor), allow long passphrases and all printable characters, and check new passwords against a breached-password list.
  verify: Set a long passphrase in lower case letters only through this path and confirm it is accepted.
BASE-PASSWORD-EXPIRY:
  title: Passwords expire on a schedule
  effort_minutes: 20
  detail: A setting or field here looks like a forced password change after a fixed time. Forced rotation leads to small, predictable changes (Summer2025 to Autumn2025); NIST SP 800-63B asks for a change only when there is evidence of compromise.
  proof_needed: Check that this setting forces users to change their password after a fixed time, rather than expiring a reset link or a one-time code.
  attack: Guess the next password in a rotation sequence from an old leaked one.
  blast: Accounts whose current password follows from a previous one.
  fix: Remove the scheduled expiry. Force a change only after a suspected compromise, and check new passwords against a breached-password list.
  verify: Move the clock past the old expiry period in a test and confirm sign-in does not demand a new password.
